# render.yaml - ИСПРАВЛЕНО (04.11.2025)
# Production-ready конфигурация для Render.com

services:
  # ========================================================================
  # WEB SERVICE - Main Application
  # ========================================================================
  - type: web
    name: crypto-compass
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Автодеплой при push в main
    autoDeploy: true
    
    # Health check configuration
    healthCheckPath: /health
    
    # Plan (можно изменить на standard/pro)
    plan: starter
    
    # Region (Frankfurt для EU, можно изменить)
    region: frankfurt
    
    # ========================================================================
    # КРИТИЧЕСКИЕ ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ
    # ========================================================================
    envVars:
      # ----------------------------------------------------------------
      # TELEGRAM BOT (REQUIRED - sync: false означает секретные)
      # ----------------------------------------------------------------
      - key: TELEGRAM_BOT_TOKEN
        sync: false
        # Получить: @BotFather в Telegram
      
      - key: TELEGRAM_CHANNEL_ID
        sync: false
        # Формат: @channel_name или -100xxxxxxxxxx
      
      - key: ADMIN_CHAT_ID
        sync: false
        # Ваш Telegram user ID
      
      # ----------------------------------------------------------------
      # RENDER CONFIGURATION (автоматически)
      # ----------------------------------------------------------------
      - key: PORT
        value: "8000"
      
      - key: PYTHONUNBUFFERED
        value: "1"
      
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      
      # ----------------------------------------------------------------
      # HTTP & TIMEOUT SETTINGS
      # ----------------------------------------------------------------
      - key: HTTP_TIMEOUT
        value: "30"
      
      - key: RPC_TIMEOUT
        value: "15"
      
      - key: WEBHOOK_TIMEOUT
        value: "10"
      
      # ----------------------------------------------------------------
      # MEMORY MANAGEMENT (Render Free Tier = 512MB)
      # ----------------------------------------------------------------
      - key: MAX_MEMORY_MB
        value: "450"
        # Оставляем 62MB для system overhead
      
      - key: GC_INTERVAL_SECONDS
        value: "300"
        # Garbage collection каждые 5 минут
      
      # ----------------------------------------------------------------
      # SYSTEM FEATURES
      # ----------------------------------------------------------------
      - key: WHALE_ENABLED
        value: "true"
      
      - key: NEWS_ENABLED
        value: "true"
      
      - key: CHAINS_ENABLED
        value: "true"
      
      - key: ANALYTICS_ENABLED
        value: "true"
      
      - key: TRADING_ENABLED
        value: "true"
      
      - key: HYPERLIQUID_ENABLED
        value: "true"
      
      # ----------------------------------------------------------------
      # MONITORING & HEALTH
      # ----------------------------------------------------------------
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      
      - key: HEALTH_CHECK_INTERVAL
        value: "300"
      
      - key: HEALTH_CHECK_MAX_SILENCE
        value: "3600"
      
      - key: SEND_STARTUP_NOTIFICATION
        value: "true"
      
      - key: SEND_DAILY_STATS
        value: "true"
      
      # ----------------------------------------------------------------
      # RATE LIMITING & PERFORMANCE
      # ----------------------------------------------------------------
      - key: POSTS_PER_HOUR_CAP
        value: "5"
      
      - key: FETCH_INTERVAL
        value: "300"
      
      - key: NEWS_CHECK_INTERVAL
        value: "300"
      
      - key: POLL_SECONDS
        value: "120"
      
      # ----------------------------------------------------------------
      # WHALE DETECTION
      # ----------------------------------------------------------------
      - key: WHALE_MIN_VALUE_USD
        value: "50000"
      
      - key: MIN_USD_THRESHOLD
        value: "50000"
      
      - key: MIN_CONFIDENCE_SCORE
        value: "6"
      
      - key: START_FROM_MINUTES_AGO
        value: "60"
      
      # ----------------------------------------------------------------
      # ENABLED CHAINS
      # ----------------------------------------------------------------
      - key: ENABLED_CHAINS
        value: "ethereum,bsc,polygon,arbitrum,base,solana"
      
      # ----------------------------------------------------------------
      # RPC ENDPOINTS (бесплатные публичные)
      # ----------------------------------------------------------------
      - key: ETHEREUM_RPC_URL
        value: "https://eth.llamarpc.com"
      
      - key: BSC_RPC_URL
        value: "https://bsc-dataseed.binance.org"
      
      - key: POLYGON_RPC_URL
        value: "https://polygon-rpc.com"
      
      - key: ARBITRUM_RPC_URL
        value: "https://arb1.arbitrum.io/rpc"
      
      - key: BASE_RPC_URL
        value: "https://mainnet.base.org"
      
      - key: SOLANA_RPC_URL
        value: "https://api.mainnet-beta.solana.com"
      
      # ----------------------------------------------------------------
      # API KEYS (опциональные, но рекомендуемые)
      # ----------------------------------------------------------------
      - key: ETHERSCAN_API_KEY
        sync: false
        # Получить: https://etherscan.io/apis
      
      - key: BSCSCAN_API_KEY
        sync: false
        # Получить: https://bscscan.com/apis
      
      - key: POLYGONSCAN_API_KEY
        sync: false
        # Получить: https://polygonscan.com/apis
      
      - key: ARBISCAN_API_KEY
        sync: false
      
      - key: BASESCAN_API_KEY
        sync: false
      
      - key: HELIUS_API_KEY
        sync: false
        # Рекомендуется для Solana: https://helius.dev
      
      - key: COINGECKO_API_KEY
        sync: false
        # Опционально для цен: https://coingecko.com/api
      
      # ----------------------------------------------------------------
      # AI KEYS (для новостей)
      # ----------------------------------------------------------------
      - key: OPENAI_API_KEY
        sync: false
        # Опционально для AI summaries
      
      - key: ANTHROPIC_API_KEY
        sync: false
        # Альтернатива OpenAI
      
      # ----------------------------------------------------------------
      # HYPERLIQUID EXCHANGE
      # ----------------------------------------------------------------
      - key: HYPERLIQUID_API_URL
        value: "https://api.hyperliquid.xyz"
      
      - key: HYPERLIQUID_MIN_TRADE_USD
        value: "100000"
      
      - key: HYPERLIQUID_MIN_LIQUIDATION_USD
        value: "50000"
      
      - key: HYPERLIQUID_MIN_WHALE_ACTIVITY_USD
        value: "500000"
      
      - key: HYPERLIQUID_NOTIFY_WHALE_ACTIVITY
        value: "true"
      
      - key: HYPERLIQUID_NOTIFY_LIQUIDATIONS
        value: "true"
      
      # ----------------------------------------------------------------
      # TRADING SYSTEM
      # ----------------------------------------------------------------
      - key: TRADING_SIGNAL_INTERVAL_HOURS
        value: "1"
      
      - key: TRADING_MONITORED_ASSETS
        value: "BTC,ETH,SOL,BNB,XRP,ADA,AVAX,DOT,MATIC,LINK"
      
      # ----------------------------------------------------------------
      # SMART DISCOVERY
      # ----------------------------------------------------------------
      - key: SMART_DISCOVERY_ENABLED
        value: "true"
      
      - key: SMART_DISCOVERY_INTERVAL_HOURS
        value: "6"
      
      - key: SMART_DISCOVERY_MAX_NEW_WALLETS
        value: "10"
      
      # ----------------------------------------------------------------
      # VALIDATION
      # ----------------------------------------------------------------
      - key: VALIDATION_ENABLED
        value: "true"
      
      - key: VALIDATION_INTERVAL_DAYS
        value: "1"
      
      - key: VALIDATION_MIN_SCORE_TO_KEEP
        value: "30"
      
      # ----------------------------------------------------------------
      # ADAPTIVE THRESHOLDS
      # ----------------------------------------------------------------
      - key: ADAPTIVE_THRESHOLDS_ENABLED
        value: "true"
      
      - key: ADAPTIVE_BASE_MIN_CONFIDENCE
        value: "40"
      
      # ----------------------------------------------------------------
      # PERFORMANCE TRACKING
      # ----------------------------------------------------------------
      - key: PERFORMANCE_TRACKING_ENABLED
        value: "true"
      
      - key: PERFORMANCE_SUCCESS_THRESHOLD
        value: "0.05"
      
      # ----------------------------------------------------------------
      # SOLANA RATE LIMITING (КРИТИЧНО!)
      # ----------------------------------------------------------------
      - key: SOLANA_RATE_LIMIT_REQUESTS
        value: "50"
      
      - key: SOLANA_RATE_LIMIT_WINDOW
        value: "60"
      
      - key: SOLANA_RETRY_ON_429
        value: "1"
      
      # ----------------------------------------------------------------
      # PATHS (для Render Disk)
      # ----------------------------------------------------------------
      - key: WALLET_DB_JSON_PATH
        value: "data/wallets/tracked_wallets.json"
      
      - key: STATE_FILE
        value: "data/state.json"

# ============================================================================
# DATABASES (опционально - для будущего использования)
# ============================================================================
databases:
  # Пример PostgreSQL (если понадобится)
  # - name: crypto-compass-db
  #   databaseName: crypto_compass
  #   user: crypto_compass_user
  #   plan: starter
  #   region: frankfurt

# ============================================================================
# NOTES
# ============================================================================
# 
# SETUP INSTRUCTIONS:
# 1. Fork this repository
# 2. Создать сервис на Render.com
# 3. Подключить GitHub repo
# 4. Добавить секретные переменные через Render UI:
#    - TELEGRAM_BOT_TOKEN
#    - TELEGRAM_CHANNEL_ID
#    - ADMIN_CHAT_ID
#    - API keys (опционально)
# 5. Deploy!
#
# WEBHOOK URL:
# Автоматически будет: https://crypto-compass.onrender.com/webhook/telegram
# Если изменили service name, обновите в коде
#
# PERSISTENT STORAGE:
# Если нужно сохранять данные между деплоями:
# 1. Добавить Render Disk в UI
# 2. Mount path: /app/data
# 3. Обновить DB_PATH в database.py
#
# MONITORING:
# - Health: https://crypto-compass.onrender.com/health
# - Logs: Render Dashboard → Logs
#
# SCALING:
# Free tier имеет ограничения:
# - 512MB RAM
# - Sleeps after 15 min inactivity
# - 750 hours/month
#
# Для production рекомендуется plan: starter или выше