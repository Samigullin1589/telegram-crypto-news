services:
  - type: web
    name: crypto-compass
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    
    healthCheckPath: /health
    
    plan: starter
    
    region: frankfurt
    
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      
      - key: CHAT_ID
        sync: false
      
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      
      - key: ADMIN_CHAT_ID
        sync: false
      
      - key: WEBHOOK_URL
        value: https://crypto-compass.onrender.com/webhook/telegram
      
      - key: PORT
        value: "8000"
      
      - key: PYTHONUNBUFFERED
        value: "1"
      
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      
      - key: HTTP_TIMEOUT
        value: "30"
      
      - key: RPC_TIMEOUT
        value: "15"
      
      - key: MAX_MEMORY_MB
        value: "480"
      
      - key: FETCH_INTERVAL
        value: "300"
      
      - key: NEWS_CHECK_INTERVAL
        value: "300"
      
      - key: POSTS_PER_HOUR_CAP
        value: "5"
      
      - key: MIN_CONFIDENCE_SCORE
        value: "6"
      
      - key: WHALE_MIN_VALUE_USD
        value: "50000"
      
      - key: MIN_USD_THRESHOLD
        value: "50000"
      
      - key: POLL_SECONDS
        value: "120"
      
      - key: START_FROM_MINUTES_AGO
        value: "60"
      
      - key: TRADING_ENABLED
        value: "true"
      
      - key: CHAINS_ENABLED
        value: "true"
      
      - key: ANALYTICS_ENABLED
        value: "true"
      
      - key: HYPERLIQUID_ENABLED
        value: "true"
      
      - key: SMART_DISCOVERY_ENABLED
        value: "true"
      
      - key: VALIDATION_ENABLED
        value: "true"
      
      - key: ADAPTIVE_THRESHOLDS_ENABLED
        value: "true"
      
      - key: PERFORMANCE_TRACKING_ENABLED
        value: "true"
      
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      
      - key: HEALTH_CHECK_INTERVAL
        value: "300"
      
      - key: HEALTH_CHECK_MAX_SILENCE
        value: "3600"
      
      - key: SEND_STARTUP_NOTIFICATION
        value: "true"
      
      - key: SEND_DAILY_STATS
        value: "true"
      
      - key: ENABLE_IMAGES
        value: "true"
      
      - key: ASSETS
        value: "*"
      
      - key: DISCOVERY_REFRESH_HOURS
        value: "6"
      
      - key: ENABLED_CHAINS
        value: "ethereum,bsc,polygon,arbitrum,base,solana"
      
      - key: ETH_RPC_URL
        value: https://eth.llamarpc.com
      
      - key: ETHEREUM_RPC_URL
        value: https://eth.llamarpc.com
      
      - key: BSC_RPC_URL
        value: https://bsc-dataseed.binance.org
      
      - key: POLYGON_RPC_URL
        value: https://polygon-rpc.com
      
      - key: ARBITRUM_RPC_URL
        value: https://arb1.arbitrum.io/rpc
      
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      
      - key: OPTIMISM_RPC_URL
        value: https://mainnet.optimism.io
      
      - key: AVALANCHE_RPC_URL
        value: https://api.avax.network/ext/bc/C/rpc
      
      - key: ETHERSCAN_API_KEY
        sync: false
      
      - key: BSCSCAN_API_KEY
        sync: false
      
      - key: POLYGONSCAN_API_KEY
        sync: false
      
      - key: ARBISCAN_API_KEY
        sync: false
      
      - key: BASESCAN_API_KEY
        sync: false
      
      - key: OPTIMISM_API_KEY
        sync: false
      
      - key: SNOWTRACE_API_KEY
        sync: false
      
      - key: HELIUS_API_KEY
        sync: false
      
      - key: COINGECKO_API_KEY
        sync: false
      
      - key: OPENAI_API_KEY
        sync: false
      
      - key: ANTHROPIC_API_KEY
        sync: false
      
      - key: HYPERLIQUID_API_URL
        value: https://api.hyperliquid.xyz
      
      - key: HYPERLIQUID_MIN_TRADE_USD
        value: "100000"
      
      - key: HYPERLIQUID_MIN_LIQUIDATION_USD
        value: "50000"
      
      - key: HYPERLIQUID_MIN_WHALE_ACTIVITY_USD
        value: "500000"
      
      - key: HYPERLIQUID_WHALE_MIN_CONFIDENCE
        value: "70"
      
      - key: HYPERLIQUID_LIQUIDATION_MIN_CONFIDENCE
        value: "60"
      
      - key: HYPERLIQUID_NOTIFY_WHALE_ACTIVITY
        value: "true"
      
      - key: HYPERLIQUID_NOTIFY_LIQUIDATIONS
        value: "true"
      
      - key: HYPERLIQUID_NOTIFY_FUNDING
        value: "true"
      
      - key: HYPERLIQUID_NOTIFY_VOLUME_SPIKES
        value: "true"
      
      - key: HYPERLIQUID_WHALE_ACTIVITY_CHECK_INTERVAL
        value: "300"
      
      - key: HYPERLIQUID_WHALE_ACTIVITY_LOOKBACK_MINUTES
        value: "60"
      
      - key: HYPERLIQUID_LIQUIDATION_CHECK_INTERVAL
        value: "300"
      
      - key: HYPERLIQUID_LIQUIDATION_LOOKBACK_MINUTES
        value: "60"
      
      - key: HYPERLIQUID_FUNDING_CHECK_INTERVAL
        value: "600"
      
      - key: HYPERLIQUID_EXTREME_FUNDING_THRESHOLD
