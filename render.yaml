      - key: ADAPTIVE_BASE_MIN_VOLUME_24H
        value: "1000000"
      
      - key: ADAPTIVE_BULL_THRESHOLD
        value: "5.0"
      
      - key: ADAPTIVE_BEAR_THRESHOLD
        value: "-5.0"
      
      - key: ADAPTIVE_BULL_CONFIDENCE_MODIFIER
        value: "-5"
      
      - key: ADAPTIVE_BULL_SIZE_REL_MODIFIER
        value: "-0.03"
      
      - key: ADAPTIVE_BULL_VOLUME_MODIFIER
        value: "1.5"
      
      - key: ADAPTIVE_BEAR_CONFIDENCE_MODIFIER
        value: "10"
      
      - key: ADAPTIVE_BEAR_SIZE_REL_MODIFIER
        value: "0.05"
      
      - key: ADAPTIVE_BEAR_VOLUME_MODIFIER
        value: "0.7"
      
      - key: ADAPTIVE_MIN_SIGNALS_FOR_ADAPTATION
        value: "20"
      
      - key: ADAPTIVE_LOW_ACCURACY_THRESHOLD
        value: "0.40"
      
      - key: ADAPTIVE_HIGH_ACCURACY_THRESHOLD
        value: "0.70"
      
      - key: ADAPTIVE_ACCURACY_ADJUSTMENT
        value: "5"
      
      - key: ADAPTIVE_MARKET_REGIME_UPDATE_HOURS
        value: "6"
      
      - key: PERFORMANCE_SUCCESS_THRESHOLD
