services:
  - type: web
    name: crypto-compass
    runtime: python
    
    plan: starter
    region: frankfurt
    
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    
    autoDeploy: true
    
    healthCheckPath: /health
    
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      
      - key: ADMIN_CHAT_ID
        sync: false
      
      - key: PORT
        value: "8000"
      
      - key: PYTHONUNBUFFERED
        value: "1"
      
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      
      - key: HTTP_TIMEOUT
        value: "30"
      
      - key: RPC_TIMEOUT
        value: "15"
      
      - key: WEBHOOK_TIMEOUT
        value: "10"
      
      - key: MAX_MEMORY_MB
        value: "450"
      
      - key: GC_INTERVAL_SECONDS
        value: "300"
      
      - key: WHALE_ENABLED
        value: "true"
      
      - key: NEWS_ENABLED
        value: "true"
      
      - key: CHAINS_ENABLED
        value: "true"
      
      - key: ANALYTICS_ENABLED
        value: "true"
      
      - key: TRADING_ENABLED
        value: "true"
      
      - key: HYPERLIQUID_ENABLED
        value: "true"
      
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      
      - key: HEALTH_CHECK_INTERVAL
        value: "300"
      
      - key: HEALTH_CHECK_MAX_SILENCE
        value: "3600"
      
      - key: SEND_STARTUP_NOTIFICATION
        value: "true"
      
      - key: SEND_DAILY_STATS
        value: "true"
      
      - key: POSTS_PER_HOUR_CAP
        value: "5"
      
      - key: FETCH_INTERVAL
        value: "300"
      
      - key: NEWS_CHECK_INTERVAL
        value: "300"
      
      - key: POLL_SECONDS
        value: "120"
      
      - key: WHALE_MIN_VALUE_USD
        value: "50000"
      
      - key: MIN_USD_THRESHOLD
        value: "50000"
      
      - key: MIN_CONFIDENCE_SCORE
        value: "6"
      
      - key: START_FROM_MINUTES_AGO
        value: "60"
      
      - key: ENABLED_CHAINS
        value: "ethereum,bsc,polygon,arbitrum,base,solana"
      
      - key: ETHEREUM_RPC_URL
        value: "https://eth.llamarpc.com"
      
      - key: BSC_RPC_URL
        value: "https://bsc-dataseed1.binance.org"
      
      - key: POLYGON_RPC_URL
        value: "https://polygon-rpc.com"
      
      - key: ARBITRUM_RPC_URL
        value: "https://arb1.arbitrum.io/rpc"
      
      - key: BASE_RPC_URL
        value: "https://mainnet.base.org"
      
      - key: SOLANA_RPC_URL
        value: "https://api.mainnet-beta.solana.com"
      
      - key: ETHERSCAN_API_KEY
        sync: false
      
      - key: BSCSCAN_API_KEY
        sync: false
      
      - key: POLYGONSCAN_API_KEY
        sync: false
      
      - key: ARBISCAN_API_KEY
        sync: false
      
      - key: BASESCAN_API_KEY
        sync: false
      
      - key: HELIUS_API_KEY
        sync: false
      
      - key: COINGECKO_API_KEY
        sync: false
      
      - key: OPENAI_API_KEY
        sync: false
      
      - key: ANTHROPIC_API_KEY
        sync: false
      
      - key: HYPERLIQUID_API_URL
        value: "https://api.hyperliquid.xyz"
      
      - key: HYPERLIQUID_MIN_TRADE_USD
        value: "100000"
      
      - key: HYPERLIQUID_MIN_LIQUIDATION_USD
        value: "50000"
      
      - key: HYPERLIQUID_MIN_WHALE_ACTIVITY_USD
        value: "500000"
      
      - key: HYPERLIQUID_NOTIFY_WHALE_ACTIVITY
        value: "true"
      
      - key: HYPERLIQUID_NOTIFY_LIQUIDATIONS
        value: "true"
      
      - key: TRADING_SIGNAL_INTERVAL_HOURS
        value: "1"
      
      - key: TRADING_MONITORED_ASSETS
        value: "BTC,ETH,SOL,BNB,XRP,ADA,AVAX,DOT,MATIC,LINK"
      
      - key: SMART_DISCOVERY_ENABLED
        value: "true"
      
      - key: SMART_DISCOVERY_INTERVAL_HOURS
        value: "6"
      
      - key: SMART_DISCOVERY_MAX_NEW_WALLETS
        value: "10"
      
      - key: VALIDATION_ENABLED
        value: "true"
      
      - key: VALIDATION_INTERVAL_DAYS
        value: "1"
      
      - key: VALIDATION_MIN_SCORE_TO_KEEP
        value: "30"
      
      - key: ADAPTIVE_THRESHOLDS_ENABLED
        value: "true"
      
      - key: ADAPTIVE_BASE_MIN_CONFIDENCE
        value: "40"
      
      - key: PERFORMANCE_TRACKING_ENABLED
        value: "true"
      
      - key: PERFORMANCE_SUCCESS_THRESHOLD
        value: "0.05"
      
      - key: SOLANA_RATE_LIMIT_REQUESTS
        value: "50"
      
      - key: SOLANA_RATE_LIMIT_WINDOW
        value: "60"
      
      - key: SOLANA_RETRY_ON_429
        value: "1"
      
      - key: WALLET_DB_JSON_PATH
        value: "data/wallets/tracked_wallets.json"
      
      - key: STATE_FILE
        value: "data/state.json"
      
      - key: LOG_LEVEL
        value: "INFO"
      
      - key: SENTRY_DSN
        sync: false
      
      - key: ENABLE_METRICS
        value: "true"
      
      - key: METRICS_PORT
        value: "9090"